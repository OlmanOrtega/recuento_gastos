{% extends "base.html" %}
{% block titulo %}Recuperar contraseña - GastoFlow{% endblock %}

{% block contenido %}
<div class="auth-wrap">
    <div class="logo" style="font-size: 1.2rem; display: flex; justify-content: center; margin-bottom: 1.5rem;">gasto<span class="punto">flow</span></div>

    <div class="recibo">
        <h2>Recuperar contraseña</h2>
        <p class="texto-suave" style="margin-bottom: 1rem; font-size: 0.9rem;">
            Ingresá tu email y te enviamos un enlace para restablecer tu contraseña.
        </p>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="campo">
                <label>Email</label>
                <input type="email" name="email" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-accent btn-bloque">
                <i class="ph ph-envelope"></i> Enviar enlace
            </button>
        </form>
    </div>

    <div class="auth-link">
        <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
