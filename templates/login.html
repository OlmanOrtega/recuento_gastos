{% extends "base.html" %}
{% block titulo %}Iniciar sesión - GastoFlow{% endblock %}

{% block contenido %}
<div class="auth-wrap">
    <div class="logo" style="font-size: 1.2rem; display: flex; justify-content: center; margin-bottom: 1.5rem;">gasto<span class="punto">flow</span></div>

    <div class="recibo">
        <h2>Iniciar sesión</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-jade btn-bloque">Entrar</button>
        </form>
        <p style="text-align:center; margin-top:0.75rem; font-size:0.85rem;">
            <a href="{{ url_for('auth.recuperar_password') }}" style="color: var(--accent);">¿Olvidaste tu contraseña?</a>
        </p>
    </div>

    <div class="auth-link">
        ¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Creá una</a>
    </div>
    <div class="auth-link" style="margin-top:0.5rem;">
        <a href="{{ url_for('auth.invitado') }}" style="color: var(--tinta-suave);">Continuar como invitado</a>
    </div>
</div>
{% endblock %}
