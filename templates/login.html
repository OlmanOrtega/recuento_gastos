{% extends "base.html" %}
{% block titulo %}Iniciar sesión - GastoFlow{% endblock %}

{% block contenido %}
<div class="landing-hero" style="padding-top: 1.5rem;">
    <div class="logo" style="font-size: 1.2rem; justify-content: center; display: flex;">gasto<span class="punto">flow</span></div>
</div>

<div class="recibo">
    <h2>Iniciar sesión</h2>
    <form method="POST">
        <div class="campo">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn btn-jade btn-bloque">Entrar</button>
    </form>
</div>

<p class="centrado texto-suave">
    ¿No tenés cuenta? <a href="{{ url_for('auth.registro') }}">Creá una</a>
</p>
{% endblock %}
