{% extends "base.html" %}
{% block titulo %}Historial - GastoFlow{% endblock %}

{% block contenido %}
<h1 style="font-family: var(--fuente-sans); font-weight: 700; font-size: 1.4rem; margin-bottom: 0.75rem; color: var(--tinta);">Historial</h1>

<div id="contenido-historial">
    <div class="recibo filtros-recibo">
        <form method="GET" action="{{ url_for('transacciones.historial') }}" id="form-filtros">
            <!-- Búsqueda -->
            <div class="campo busqueda-wrap" style="margin-bottom: 0.75rem;">
                <span class="icono-busqueda"><i class="ph ph-magnifying-glass"></i></span>
                <input type="search" name="q" placeholder="Buscar por nota o monto..." value="{{ q or '' }}" id="input_q">
            </div>

            <!-- Mes + Categoría en fila -->
            <div class="filtros-fila">
                <div style="flex:1; min-width:0;">
                    <label class="filtro-label">Mes</label>
                    <select name="mes_anio" id="select_mes">
                        <option value="">-- Todos --</option>
                        {% for m in meses_disponibles %}
                            <option value="{{ m.anio }}-{{ m.mes }}"
                                {% if anio_seleccionado == m.anio and mes_seleccionado == m.mes %}selected{% endif %}>
                                {{ m.etiqueta }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex:1; min-width:0;">
                    <label class="filtro-label">Categoría</label>
                    <select name="categoria_id" id="select_categoria">
                        <option value="">-- Todas --</option>
                        {% for categoria in categorias %}
                            <option value="{{ categoria.id }}" {% if categoria_seleccionada == categoria.id %}selected{% endif %}>
                                {{ categoria.nombre }} ({{ categoria.tipo }})
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <input type="hidden" name="anio"        id="input_anio"   value="{{ anio_seleccionado or '' }}">
            <input type="hidden" name="mes"         id="input_mes"    value="{{ mes_seleccionado or '' }}">
            <input type="hidden" name="semana"      id="input_semana" value="{{ semana_seleccionada or '' }}">
            <input type="hidden" name="metodo_pago" id="input_metodo" value="{{ metodo_pago_seleccionado or '' }}">
        </form>

        <!-- Chips método de pago -->
        <div style="margin-top:0.6rem;">
            <label class="filtro-label">Método de pago</label>
            <div class="semanas-scroll" id="chips-metodo-hist">
                <button type="button" data-metodo="" class="chip-semana {% if not metodo_pago_seleccionado %}activo{% endif %}">
                    <span class="chip-label">Todos</span>
                </button>
                <button type="button" data-metodo="efectivo" class="chip-semana {% if metodo_pago_seleccionado == 'efectivo' %}activo{% endif %}">
                    <span class="chip-label"><i class="ph ph-money"></i> Efectivo</span>
                </button>
                <button type="button" data-metodo="digital" class="chip-semana {% if metodo_pago_seleccionado == 'digital' %}activo{% endif %}">
                    <span class="chip-label"><i class="ph ph-credit-card"></i> Digital</span>
                </button>
            </div>
        </div>

        <!-- Chips semanas -->
        {% if semanas_disponibles %}
        <div style="margin-top:0.4rem;">
            <label class="filtro-label">Semana</label>
            <div class="semanas-scroll" id="campo_semanas">
                <button type="button" data-semana="" class="chip-semana {% if not semana_seleccionada %}activo{% endif %}">
                    <span class="chip-label">Todo el mes</span>
                </button>
                {% for semana in semanas_disponibles %}
                    <button type="button" data-semana="{{ semana.numero }}"
                            class="chip-semana {% if semana_seleccionada == semana.numero %}activo{% endif %}">
                        <span class="chip-num">S{{ semana.numero }}</span>
                        <span class="chip-rango">{{ semana.inicio }}–{{ semana.fin }}</span>
                    </button>
                {% endfor %}
            </div>
        </div>
        {% endif %}

        <div style="margin-top:0.75rem; display:flex; justify-content:space-between; align-items:center; font-size:0.8rem;">
            <a href="{{ url_for('transacciones.historial') }}" style="color:var(--accent);">
                <i class="ph ph-x-circle"></i> Limpiar filtros
            </a>
            <a href="{{ url_for('transacciones.exportar_csv', anio=anio_seleccionado, mes=mes_seleccionado, categoria_id=categoria_seleccionada) }}" style="color:var(--tinta-suave);">
                <i class="ph ph-file-csv"></i> Exportar CSV
            </a>
        </div>
    </div>

    <div id="tabla-container">
        {% include "_tabla_historial.html" %}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const contenedor = document.getElementById('contenido-historial');
        let searchTimeout = null;

        function actualizarTodo() {
            const form = document.getElementById('form-filtros');
            const formData = new FormData(form);
            const params = new URLSearchParams(formData);
            const url = "{{ url_for('transacciones.historial_data') }}?" + params.toString();

            document.getElementById('tabla-container').innerHTML =
                '<p class="texto-suave" style="text-align:center; padding:1.5rem 0;">Cargando...</p>';

            fetch(url)
                .then(r => r.text())
                .then(html => {
                    contenedor.innerHTML = html;
                    inicializarEventos();
                })
                .catch(() => {
                    document.getElementById('tabla-container').innerHTML =
                        '<p class="texto-suave" style="text-align:center; color:var(--oxido);">Error al cargar los datos.</p>';
                });
        }

        function inicializarEventos() {
            document.getElementById('input_q')?.addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(actualizarTodo, 400);
            });

            document.getElementById('select_mes')?.addEventListener('change', function() {
                const valor = this.value;
                if (!valor) {
                    document.getElementById('input_anio').value = '';
                    document.getElementById('input_mes').value = '';
                    document.getElementById('input_semana').value = '';
                } else {
                    const [anio, mes] = valor.split('-');
                    document.getElementById('input_anio').value = anio;
                    document.getElementById('input_mes').value = mes;
                    document.getElementById('input_semana').value = '';
                }
                actualizarTodo();
            });

            document.getElementById('select_categoria')?.addEventListener('change', function() {
                document.getElementById('input_semana').value = '';
                actualizarTodo();
            });

            // Chips método de pago
            document.getElementById('chips-metodo-hist')?.addEventListener('click', function(e) {
                const btn = e.target.closest('.chip-semana');
                if (!btn) return;
                document.getElementById('input_metodo').value = btn.dataset.metodo || '';
                document.querySelectorAll('#chips-metodo-hist .chip-semana').forEach(b => b.classList.remove('activo'));
                btn.classList.add('activo');
                actualizarTodo();
            });

            // Chips semana
            document.getElementById('campo_semanas')?.addEventListener('click', function(e) {
                const btn = e.target.closest('.chip-semana');
                if (!btn) return;
                document.getElementById('input_semana').value = btn.dataset.semana || '';
                document.querySelectorAll('#campo_semanas .chip-semana').forEach(b => b.classList.remove('activo'));
                btn.classList.add('activo');
                actualizarTodo();
            });

            document.querySelectorAll('[data-pagina]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const pagina = this.dataset.pagina;
                    const input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'pagina';
                    input.value = pagina;
                    const form = document.getElementById('form-filtros');
                    form.appendChild(input);
                    actualizarTodo();
                    form.removeChild(input);
                });
            });

            document.querySelectorAll(".form-eliminar").forEach(function(f) {
                f.removeEventListener('submit', handleEliminar);
                f.addEventListener('submit', handleEliminar);
            });
        }

        async function handleEliminar(evento) {
            evento.preventDefault();
            const confirmado = await mostrarModal(
                "¿Eliminar transacción?",
                "Esta acción no se puede deshacer.",
                "Eliminar",
                "btn-oxido"
            );
            if (!confirmado) return;

            try {
                const respuesta = await fetch(evento.currentTarget.action, {
                    method: "POST",
                    headers: { "X-Requested-With": "XMLHttpRequest" },
                });
                const resultado = await respuesta.json();
                if (resultado.exito) {
                    actualizarTodo();
                } else {
                    alert(resultado.mensaje || "Error al eliminar");
                }
            } catch {
                alert("No se pudo eliminar. Revisá tu conexión.");
            }
        }

        inicializarEventos();
    });
</script>
{% endblock %}
