{% extends "base.html" %}
{% block titulo %}Nueva contraseña - GastoFlow{% endblock %}

{% block contenido %}
<div class="auth-wrap">
    <div class="logo" style="font-size: 1.2rem; display: flex; justify-content: center; margin-bottom: 1.5rem;">gasto<span class="punto">flow</span></div>

    <div class="recibo">
        <h2>Nueva contraseña</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="campo">
                <label>Nueva contraseña <span style="color:var(--tinta-muy-suave); font-size:0.8rem;">(mín. 8 caracteres)</span></label>
                <input type="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <div class="campo">
                <label>Confirmar contraseña</label>
                <input type="password" name="confirmar" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-jade btn-bloque">
                <i class="ph ph-lock-key"></i> Restablecer contraseña
            </button>
        </form>
    </div>

    <div class="auth-link">
        <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
    </div>
</div>
{% endblock %}
