{% extends "base.html" %}
{% block titulo %}Agregar transacción - GastoFlow{% endblock %}

{% block contenido %}
<h1 style="font-family: var(--fuente-display); font-size: 1.4rem; margin-bottom: 0.3rem;">Agregar transacción</h1>

<div id="mensaje-resultado" class="texto-suave" style="min-height: 1.2rem; font-weight: 600;"></div>

<div class="recibo">
    <form method="POST" action="{{ url_for('transacciones.nueva') }}" id="form-transaccion">
        <div class="selector-tipo">
            <label class="tipo-gasto">
                <input type="radio" name="tipo" id="tipo_gasto" value="gasto" checked onchange="mostrarCategoriasSegunTipo()">
                <span>Gasto</span>
            </label>
            <label class="tipo-ingreso">
                <input type="radio" name="tipo" id="tipo_ingreso" value="ingreso" onchange="mostrarCategoriasSegunTipo()">
                <span>Ingreso</span>
            </label>
        </div>

        <div class="campo">
            <label>Monto (₡)</label>
            <input type="number" name="monto" step="0.01" min="0.01" required>
        </div>

        <div class="campo" id="campo_categoria_gasto">
            <label>Categoría</label>
            <select name="categoria_id" id="categoria_gasto">
                {% for categoria in categorias_gasto %}
                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo oculto" id="campo_categoria_ingreso">
            <label>Categoría</label>
            <select id="categoria_ingreso">
                {% for categoria in categorias_ingreso %}
                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label>Fecha</label>
            <input type="date" name="fecha" value="{{ hoy }}" required>
        </div>

        <div class="campo">
            <label>¿Cómo se movió el dinero? (opcional)</label>
            <select name="metodo_pago">
                <option value="">-- No especificar --</option>
                <option value="efectivo">Efectivo</option>
                <option value="digital">Digital (tarjeta, transferencia, SINPE, etc.)</option>
            </select>
        </div>

        <div class="campo">
            <label>Nota (opcional)</label>
            <input type="text" name="nota">
        </div>

        <button type="submit" class="btn btn-jade btn-bloque">Guardar transacción</button>
    </form>
</div>

<div class="recibo">
    <h2>Crear una categoría nueva</h2>
    <form method="POST" action="{{ url_for('transacciones.nueva_categoria') }}">
        <div class="campo">
            <label>Nombre</label>
            <input type="text" name="nombre_categoria" required>
        </div>
        <div class="campo">
            <label>Tipo</label>
            <select name="tipo_categoria">
                <option value="gasto">Gasto</option>
                <option value="ingreso">Ingreso</option>
            </select>
        </div>
        <button type="submit" class="btn btn-secundario btn-bloque">Crear categoría</button>
    </form>
</div>

<script>
    function mostrarCategoriasSegunTipo() {
        const tipo = document.getElementById("tipo_gasto").checked ? "gasto" : "ingreso";
        const campoGasto = document.getElementById("campo_categoria_gasto");
        const campoIngreso = document.getElementById("campo_categoria_ingreso");
        const selectGasto = document.getElementById("categoria_gasto");
        const selectIngreso = document.getElementById("categoria_ingreso");

        if (tipo === "gasto") {
            campoGasto.classList.remove("oculto");
            campoIngreso.classList.add("oculto");
            selectGasto.setAttribute("name", "categoria_id");
            selectIngreso.removeAttribute("name");
        } else {
            campoGasto.classList.add("oculto");
            campoIngreso.classList.remove("oculto");
            selectIngreso.setAttribute("name", "categoria_id");
            selectGasto.removeAttribute("name");
        }
    }

    mostrarCategoriasSegunTipo();

    const form = document.getElementById("form-transaccion");
    const divMensaje = document.getElementById("mensaje-resultado");

    form.addEventListener("submit", async function (evento) {
        evento.preventDefault();
        const datos = new FormData(form);

        try {
            const respuesta = await fetch(form.action, {
                method: "POST",
                headers: { "X-Requested-With": "XMLHttpRequest" },
                body: datos,
            });
            const resultado = await respuesta.json();

            if (resultado.exito) {
                divMensaje.textContent = resultado.mensaje;
                divMensaje.style.color = "#0B6E4F";
                form.reset();
                document.querySelector('input[name="fecha"]').value = "{{ hoy }}";
                mostrarCategoriasSegunTipo();
            } else {
                divMensaje.textContent = resultado.mensaje;
                divMensaje.style.color = "#B84B25";
            }
        } catch (error) {
            divMensaje.textContent = "No se pudo guardar. Revisa tu conexion e intenta de nuevo.";
            divMensaje.style.color = "#B84B25";
        }
    });
</script>
{% endblock %}
