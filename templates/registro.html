{% extends "base.html" %}
{% block titulo %}Crear cuenta - GastoFlow{% endblock %}

{% block contenido %}
<div class="auth-wrap">
    <div class="logo" style="font-size: 1.2rem; display: flex; justify-content: center; margin-bottom: 1.5rem;">gasto<span class="punto">flow</span></div>

    <div class="recibo">
        <h2>Crear cuenta</h2>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required autocomplete="name">
            </div>
            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="password">Contraseña <span style="color:var(--tinta-muy-suave); font-size:0.8rem;">(mín. 8 caracteres)</span></label>
                <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-jade btn-bloque">Registrarme</button>
        </form>
    </div>

    <div class="auth-link">
        ¿Ya tenés cuenta? <a href="{{ url_for('auth.login') }}">Iniciá sesión</a>
    </div>
</div>
{% endblock %}
