<div id="contenido-historial">
    <div class="recibo">
        <form method="GET" action="{{ url_for('transacciones.historial') }}" id="form-filtros">
            <div class="campo">
                <label>Mes</label>
                <select name="mes_anio" id="select_mes">
                    <option value="">-- Todos --</option>
                    {% for m in meses_disponibles %}
                        <option value="{{ m.anio }}-{{ m.mes }}"
                            {% if anio_seleccionado == m.anio and mes_seleccionado == m.mes %}selected{% endif %}>
                            {{ m.etiqueta }}
                        </option>
                    {% endfor %}
                </select>
                <input type="hidden" name="anio" id="input_anio" value="{{ anio_seleccionado or '' }}">
                <input type="hidden" name="mes" id="input_mes" value="{{ mes_seleccionado or '' }}">
                <input type="hidden" name="semana" id="input_semana" value="{{ semana_seleccionada or '' }}">
            </div>

            {% if semanas_disponibles %}
            <div class="campo" id="campo_semanas">
                <label>Semana</label>
                <div class="semanas-botones">
                    <button type="button" data-semana="" 
                            class="btn btn-chico {% if not semana_seleccionada %}btn-jade{% else %}btn-secundario{% endif %}">
                        Mes completo
                    </button>
                    {% for semana in semanas_disponibles %}
                        <button type="button" data-semana="{{ semana.numero }}" 
                                class="btn btn-chico {% if semana_seleccionada == semana.numero %}btn-jade{% else %}btn-secundario{% endif %}">
                            Sem {{ semana.numero }}
                            <small style="display:block; font-weight:400; opacity:0.7; font-size:0.55rem;">
                                {{ semana.inicio }} - {{ semana.fin }}
                            </small>
                        </button>
                    {% endfor %}
                </div>
            </div>
            {% endif %}

            <div class="campo">
                <label>Categoría</label>
                <select name="categoria_id" id="select_categoria">
                    <option value="">-- Todas --</option>
                    {% for categoria in categorias %}
                        <option value="{{ categoria.id }}" {% if categoria_seleccionada == categoria.id %}selected{% endif %}>
                            {{ categoria.nombre }} ({{ categoria.tipo }})
                        </option>
                    {% endfor %}
                </select>
            </div>
        </form>

        <div class="espacio-arriba centrado texto-suave">
            <a href="{{ url_for('transacciones.historial') }}">Limpiar filtros</a>
            &nbsp;&middot;&nbsp;
            <a href="{{ url_for('transacciones.exportar_csv', anio=anio_seleccionado, mes=mes_seleccionado, categoria_id=categoria_seleccionada) }}">
                Exportar a CSV
            </a>
        </div>
    </div>

    <!-- TABLA CON PAGINACIÓN -->
    <div id="tabla-container">
        {% include "_tabla_historial.html" %}
    </div>
</div>
